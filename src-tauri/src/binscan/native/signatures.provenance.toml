unverified_reason = "No product remains unverified. The last two were re-derived 2026-09-24 from real builds after their original anchors were measured absent from every modern binary examined: ICU now identifies by its mangled C++ symbol namespace and versions from libicuuc's bare U_ICU_VERSION literal (Debian libicu 76.1 and 78.3, transcribed into REAL_BUILD_GROUND_TRUTH); libxml2 identifies by its link-mismatch fatal prose and deliberately reports no version, because the only version-shaped text in a stripped build is the LIBXML2_2.x symbol-tag history that authoring rule 1 forbids capturing (Debian bookworm and trixie 2.9.14 builds)."
