name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check version declarations agree
        run: node tools/check-versions.mjs

      - name: Check the benchmark corpus manifest is current
        run: node tools/build-corpus-suite.mjs --check

      - name: Check every action is pinned to a commit SHA
        run: node tools/check-action-pins.mjs

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Install workflow shell test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bash jq

      - name: Test consumer workflow shell contracts
        run: npm run test:ci-shell

      - name: Build
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # CI does not need debug symbols or incremental object caches. The static
    # Tauri library plus three grammar builds otherwise exhaust Linux disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      # The version and components come from rust-toolchain.toml at the repo
      # root. `rustup show` materializes them; naming a toolchain here would
      # reintroduce the drift that file exists to prevent.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-features

      # --workspace --all-features above already runs oxaudit-benchmark and
      # bundled_signature_provenance. Do not rebuild them with a second feature set.
      - name: Diagnose Windows loader failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem src-tauri/target/debug/deps/oxaudit_lib-*.exe | ForEach-Object {
            Write-Output "Loader diagnostics: $($_.FullName)"
            if ($dumpbin) { & $dumpbin.FullName /imports $_.FullName }
            if ($mt) { & $mt.FullName "-inputresource:$($_.FullName);#1" "-out:$($_.FullName).manifest" }
          }

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      # Each language grammar is an optional dependency behind a `grammar-*`
      # feature, so a size-constrained build can leave some out. Nothing in the
      # test suite exercises those configurations — the tests assume every
      # grammar — so the guarantee CI has to hold is that they still compile.
      # A `#[cfg]` that referenced a crate not in the feature's dependency list
      # would break only here.
      - name: Reduced grammar builds compile
        if: runner.os == 'Linux'
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin oxaudit-cli --no-default-features
          cargo build --manifest-path src-tauri/Cargo.toml --bin oxaudit-cli \
            --no-default-features --features grammars-core

      # The corpus is the only defensible answer to "how accurate is it?", so a
      # change that drops precision or recall has to fail rather than quietly
      # move the number the README publishes.
      - name: Check detection quality has not regressed
        if: runner.os == 'Linux'
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --bin oxaudit-cli -- \
            benchmark --min-precision 100 --min-recall 100
