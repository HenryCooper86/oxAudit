aliases = ["libmbedtls21", "libmbedcrypto16", "libmbedx509-7", "mbedtls", "mbed_tls", "polarssl"]

  [[signature.byte_patterns]]
  pattern = "f3 0f 1e fa b8 00 .. .. 0. c3"
  capture_offset = 5
  encoding = "u32-le"
  formula = "packed8-hi"
  min = 33554432
  max = 67108863
  note = "mbedtls_version_get_number, x86-64"

