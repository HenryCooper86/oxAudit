# Component signatures for the native binary scanner.
#
# PROVENANCE. Every pattern here was read off a binary whose version was known
# independently — from `dpkg` metadata, from the package filename, or from the
# upstream release it was built from. `tools/derive-signatures.py` is the
# harness that surfaces the candidate strings; the patterns were then written
# and checked by hand against those binaries.
#
# They are deliberately NOT transcribed from cve-bin-tool's checkers. That
# project is GPL-3.0-or-later, and copying its signature files would make this
# one a derivative work. The method — anchor on a characteristic string,
# capture a version from a nearby one — is not anyone's property; the specific
# expressions are, so ours are our own.
#
# AUTHORING RULES, learned from getting these wrong:
#
#  1. Never capture from an ELF symbol-version tag. `OPENSSL_3.5.0`,
#     `GLIBC_2.26`, `ZLIB_1.2.12`, `XZ_5.4`, `LIBXML2_2.9.11` are the ABI
#     versions a library *can serve*, not the version it *is*. libcrypto.so.3
#     alone carries nine of them. Anchoring on mixed case (`OpenSSL ` and not
#     `OPENSSL_`) is usually enough to keep them out.
#  2. Anchor on prose, not on digits. A bare `1.5.7` in a binary is not
#     evidence of anything.
#  3. If a library has no version string at all — zstd, sqlite3, pcre2, lzma —
#     do not invent a weak pattern for it. The ELF package note picks those up
#     exactly, and a guess here would be worse than the silence.

# --- TLS and crypto ---------------------------------------------------------

# libcrypto.so.3: 'OpenSSL 3.5.6 7 Apr 2026'.
#
# The release date is required, not decorative. OPENSSL_VERSION_TEXT always
# carries one, and demanding it is what separates the real banner from prose
# that merely mentions a version. Without it, Python's _hashlib contributes a
# phantom "openssl 3.0.0" from the sentence "For OpenSSL 3.0.0 and newer it
# returns the state of the digest" — a documented minimum, not a linked
# library. That was a measured false positive on a Debian tree, not a
# hypothetical one.
#
# libssl carries no version of its own, only symbol tags, so OpenSSL is
# identified from libcrypto.
[[signature]]
vendor = "openssl"
product = "openssl"
filename_patterns = ['^libcrypto\.so', '^libcrypto\.[0-9]+\.dylib', '^libcrypto-[0-9]']
contains = ['part of OpenSSL', 'OPENSSLDIR:']
version_patterns = ['OpenSSL ([0-9]+\.[0-9]+\.[0-9]+[a-z]*) [0-9]{1,2} [A-Z][a-z]{2} [0-9]{4}']
ignore = ['^0\.']
aliases = ["libssl3", "libssl3t64", "libssl1.1", "libcrypto3", "openssl"]

# libgcrypt.so.20.5.0: 'This is Libgcrypt 1.11.0 - The GNU Crypto Library'
[[signature]]
vendor = "gnupg"
product = "libgcrypt"
filename_patterns = ['^libgcrypt\.so']
contains = ['This is Libgcrypt']
version_patterns = ['This is Libgcrypt ([0-9]+\.[0-9]+\.[0-9]+)']
aliases = ["libgcrypt20", "libgcrypt"]

# libgnutls.so.30.40.3: 'Enabled GnuTLS 3.8.9 logging...'
[[signature]]
vendor = "gnu"
product = "gnutls"
filename_patterns = ['^libgnutls\.so']
contains = ['Enabled GnuTLS', 'GNUTLS_DEBUG_LEVEL']
version_patterns = ['Enabled GnuTLS ([0-9]+\.[0-9]+\.[0-9]+)']
aliases = ["libgnutls30t64", "libgnutls30", "gnutls28"]

# libkrb5.so.3.3: 'KRB5_BRAND: krb5-1.21.3-final 1.21.3 20240626'
[[signature]]
vendor = "mit"
product = "kerberos_5"
filename_patterns = ['^libkrb5\.so']
contains = ['KRB5_BRAND:']
version_patterns = ['KRB5_BRAND: krb5-([0-9]+\.[0-9]+(?:\.[0-9]+)?)']
aliases = ["libkrb5-3", "krb5", "libkrb5support0"]

# libssh2.so.1.0.1: 'SSH-2.0-libssh2_1.11.1'
[[signature]]
vendor = "libssh2"
product = "libssh2"
filename_patterns = ['^libssh2\.so']
contains = ['SSH-2.0-libssh2_']
version_patterns = ['SSH-2\.0-libssh2_([0-9]+\.[0-9]+\.[0-9]+)']
aliases = ["libssh2-1", "libssh2"]

# --- compression ------------------------------------------------------------

# libz.so.1.3.1: ' inflate 1.3.1 Copyright 1995-2024 Mark Adler '
# The Copyright suffix is what separates this from the ZLIB_1.2.x symbol tags.
[[signature]]
vendor = "zlib"
product = "zlib"
filename_patterns = ['^libz\.so', '^libz\.[0-9.]*dylib']
contains = ['inflate [0-9.]+ Copyright', 'deflate [0-9.]+ Copyright']
version_patterns = [
  'inflate ([0-9]+\.[0-9]+(?:\.[0-9]+)?[a-z]?) Copyright',
  'deflate ([0-9]+\.[0-9]+(?:\.[0-9]+)?[a-z]?) Copyright',
]
aliases = ["zlib1g", "zlib", "libz1"]

# bzip2recover: 'bzip2recover 1.0.8: extracts blocks from damaged .bz2 files.'
# libbz2 itself: '1.0.8, 13-Jul-2019' — dated, which is a usable anchor.
[[signature]]
vendor = "bzip"
product = "bzip2"
filename_patterns = ['^libbz2\.so', '^bzip2$']
contains = ['bzip2recover', 'bzip2/libbzip2']
version_patterns = [
  'bzip2recover ([0-9]+\.[0-9]+\.[0-9]+):',
  'bzip2/libbzip2 version ([0-9]+\.[0-9]+\.[0-9]+)',
]
aliases = ["libbz2-1.0", "bzip2"]

# xz CLI: 'xz (XZ Utils) 5.8.1'. liblzma has only XZ_5.x symbol tags, so the
# shared library is left to the ELF package note.
#
# The CLI says `xz (XZ Utils) 5.8.1`; the library says nothing, and carries only
# `XZ_5.x` symbol tags, which are ABI versions and must never be captured. So
# liblzma's version comes from LZMA_VERSION_NUMBER in lzma_version_number().
#
# One signature, not two: NVD's CPE for both is `tukaani:xz`, so a separate
# `lzma` product would be a component that never matches a CVE.
[[signature]]
vendor = "tukaani"
product = "xz"
filename_patterns = ['^liblzma\.so', '^liblzma\.[0-9.]*dylib', '^xz$']
# The full error message, not the bare symbol name. `lzma_str_to_filters`
# appears in the dynamic symbol table of anything that links liblzma, which is
# a different claim from containing it: measured over a 21,000-file tree, the
# symbol matches 4 files and this message matches 2.
contains = ['\(XZ Utils\) [0-9]', 'Unsupported flags to lzma_str_to_filters\(\)']
version_patterns = ['\(XZ Utils\) ([0-9]+\.[0-9]+\.[0-9]+)']
aliases = ["xz-utils", "liblzma5", "liblzma", "lzma", "xz"]

  # x86-64: endbr64; mov eax, 0x2fc290c; ret. Verified against Debian trixie's
  # liblzma.so.5.8.1 — 2 matches of this idiom, exactly one inside the range.
  [[signature.byte_patterns]]
  pattern = "f3 0f 1e fa b8 .. .. .. 0. c3"
  capture_offset = 5
  encoding = "u32-le"
  formula = "decimal-10000000-stability"
  min = 50000000
  max = 59999999
  note = "lzma_version_number, x86-64"

  # AArch64: verified against Homebrew's liblzma.5.dylib — one match.
  [[signature.byte_patterns]]
  pattern = ".0 .. .. 52 .0 .. .. 72 c0 03 5f d6"
  capture_offset = 0
  encoding = "arm64-movz-movk-imm32"
  formula = "decimal-10000000-stability"
  min = 50000000
  max = 59999999
  note = "lzma_version_number, AArch64"

  # MIPS16e2 (OpenWrt mips_24kc): the same literal-pool shape as sqlite —
  # load, return, four raw big-endian bytes. Verified against OpenWrt
  # 23.05.5's liblzma_5.4.6-1: one occurrence, decoding to 0x2FB8CFE =
  # 50040062, which the stability formula reduces to 5.4.6.
  [[signature.byte_patterns]]
  pattern = "b2 01 e8 a0 .. .. .. .."
  capture_offset = 4
  encoding = "u32-be"
  formula = "decimal-10000000-stability"
  min = 50000000
  max = 59999999
  note = "lzma_version_number, MIPS16e2 literal pool"

  # ARM (A32): the same literal-pool shape as sqlite. Verified against
  # OpenWrt 23.05.5's liblzma 5.4.6 for arm_cortex-a7 — one pool site,
  # 0x2FB8CFE = 50040062, which the stability formula reduces to 5.4.6.
  [[signature.byte_patterns]]
  pattern = ".. .0 9f e5 1e ff 2f e1 .. .. .. .."
  capture_offset = 8
  encoding = "u32-le"
  formula = "decimal-10000000-stability"
  min = 50000000
  max = 59999999
  note = "lzma_version_number, ARM literal pool"

# --- transfer and parsing ---------------------------------------------------

# curl: 'curl 8.14.1 (aarch64-unknown-linux-gnu) %s'
[[signature]]
vendor = "haxx"
product = "curl"
filename_patterns = ['^curl$', '^curl\.exe$']
contains = ['curl [0-9]+\.[0-9]+\.[0-9]+ \(']
version_patterns = ['\ncurl ([0-9]+\.[0-9]+\.[0-9]+) \(']

# libcurl.so.4.8.0: 'libcurl/8.14.1' — the User-Agent template.
[[signature]]
vendor = "haxx"
product = "libcurl"
filename_patterns = ['^libcurl\.so', '^libcurl\.[0-9.]*dylib']
contains = ['libcurl/[0-9]']
version_patterns = ['libcurl/([0-9]+\.[0-9]+\.[0-9]+)']
aliases = ["libcurl4", "libcurl4t64", "libcurl3t64-gnutls", "libcurl"]

# libexpat.so.1.12.2: 'expat_2.8.2'
[[signature]]
vendor = "libexpat"
product = "expat"
filename_patterns = ['^libexpat\.so', '^libexpat\.[0-9.]*dylib']
contains = ['expat_[0-9]+\.[0-9]+\.[0-9]+']
version_patterns = ['expat_([0-9]+\.[0-9]+\.[0-9]+)']
aliases = ["libexpat1", "expat"]

# libpng16.so.16.48.0: 'libpng version 1.6.48'
[[signature]]
vendor = "libpng"
product = "libpng"
filename_patterns = ['^libpng[0-9]*\.so', '^libpng[0-9]*\.[0-9.]*dylib']
contains = ['libpng version']
version_patterns = ['libpng version ([0-9]+\.[0-9]+\.[0-9]+)']
aliases = ["libpng16-16", "libpng16-16t64", "libpng"]

# libxml2, re-derived from Debian bookworm and trixie builds (both 2.9.14):
# the anchors this entry used to carry ('libxml2 version', 'xmlsoft.org')
# exist in neither — measured, not assumed. No version string exists at all
# in these builds; the only version-shaped text is the LIBXML2_2.x
# symbol-version tags, which rule 1 forbids capturing (2.9.14 still tags
# 2.4.30 — those are the ABIs it can serve, not what it is). The identity
# anchor is the link-mismatch fatal prose, which has named the library since
# the 2.x era. Version stays unknown here; ELF package notes report it
# exactly wherever the distro left one.
[[signature]]
vendor = "xmlsoft"
product = "libxml2"
filename_patterns = ['^libxml2\.so', '^libxml2\.[0-9.]*dylib']
contains = ['program compiled against libxml']
aliases = ["libxml2"]

# --- system -----------------------------------------------------------------

# busybox 1.38.0: 'BusyBox v1.38.0 (2026-05-13 02:21:49 UTC)'
[[signature]]
vendor = "busybox"
product = "busybox"
filename_patterns = ['^busybox$']
contains = ['BusyBox is a multi-call binary', 'BusyBox v[0-9]']
version_patterns = ['BusyBox v([0-9]+\.[0-9]+\.[0-9]+)']

# libc.so.6: 'GNU C Library (Debian GLIBC 2.41-…) stable release version 2.41.'
# Anchored past the distribution's own bracketed string, which carries a
# different (packaged) version.
[[signature]]
vendor = "gnu"
product = "glibc"
filename_patterns = ['^libc\.so\.6$', '^ld-linux']
contains = ['GNU C Library']
version_patterns = ['stable release version ([0-9]+\.[0-9]+(?:\.[0-9]+)?)']
aliases = ["libc6", "libc-bin", "glibc"]

# bash 5.2.37: '@(#)Bash version 5.2.37(1) release GNU'
[[signature]]
vendor = "gnu"
product = "bash"
filename_patterns = ['^bash$']
contains = ['Bash version [0-9]']
version_patterns = ['Bash version ([0-9]+\.[0-9]+(?:\.[0-9]+)?)']

# util-linux 2.41: 'util-linux 2.41'
[[signature]]
vendor = "kernel"
product = "util-linux"
filename_patterns = []
contains = ['util-linux [0-9]+\.[0-9]+']
version_patterns = ['util-linux ([0-9]+\.[0-9]+(?:\.[0-9]+)?)']

# binutils 2.44: '(GNU Binutils for Debian) 2.44'
[[signature]]
vendor = "gnu"
product = "binutils"
filename_patterns = []
contains = ['GNU Binutils']
version_patterns = ['GNU Binutils[^)\n]{0,40}\) ([0-9]+\.[0-9]+(?:\.[0-9]+)?)']

# perl 5.40.1: 'Builtin version bundle "%s" is not supported by Perl 5.40.1'
[[signature]]
vendor = "perl"
product = "perl"
filename_patterns = ['^perl$', '^libperl\.so']
contains = ['not supported by Perl [0-9]', 'PERL_HASH_SEED']
version_patterns = ['supported by Perl ([0-9]+\.[0-9]+\.[0-9]+)']

# git 2.47.3: 'git/2.47.3' — the User-Agent template.
[[signature]]
vendor = "git"
product = "git"
filename_patterns = ['^git$']
contains = ['git/[0-9]+\.[0-9]+']
version_patterns = ['git/([0-9]+\.[0-9]+\.[0-9]+)']

# GnuPG 2.4.7: 'Dirmngr 2.4.7 at your service', 'Keyboxd 2.4.7 at your service'
[[signature]]
vendor = "gnupg"
product = "gnupg"
filename_patterns = ['^gpg$', '^gpg-agent$', '^dirmngr$']
contains = ['at your service', 'GNU Privacy Guard']
version_patterns = [
  '(?:Dirmngr|Keyboxd|GPG Agent) ([0-9]+\.[0-9]+\.[0-9]+) at your service',
  "GNU Privacy Guard's [^\\n]{0,30} ([0-9]+\\.[0-9]+\\.[0-9]+) ready",
]

# ICU, re-derived from Debian's libicu 76.1 and 78.3: the banner this entry
# used to anchor on ('%s v2.1  ICU 76.1') exists in no modern library —
# measured across every libicu*.so in both packages. What every build does
# carry is the versioned C++ symbol namespace, `_ZN6icu_78…` (identity), and
# libicuuc alone embeds U_ICU_VERSION as the only bare `major.minor` string
# in its string table. libicui18n's bare dotted strings are ln(2)/log10(e)
# constants with one-digit majors, which the two-digit-major pattern
# excludes — so libicui18n identifies without a version. The bare-digits
# version line is deliberately NOT allowed to imply identity (rule 2).
[[signature]]
vendor = "unicode"
product = "international_components_for_unicode"
filename_patterns = ['^libicuuc\.so', '^libicui18n\.so']
contains = ['icu_[0-9]{2}']
version_patterns = ['(?m)^([0-9]{2}\.[0-9]+)$']
version_implies_identity = false

# --- versions read out of code, not text ------------------------------------

# zstd is the case that motivated byte patterns. libzstd carries no version
# string at all — only `XZ_5.x`-style symbol tags and a bare "1.5.7" with
# nothing to anchor on — so both cve-bin-tool and grype miss it entirely on a
# stripped tree. What it does carry is ZSTD_versionNumber(), a one-instruction
# function returning ZSTD_VERSION_NUMBER.
#
# `max` stops at 1.9999 deliberately. zstd has been on 1.x for a decade, and
# widening the range to admit a hypothetical 2.x also admits 2.73.52 — one of
# two false "versions" this pattern produces on a real libzstd.1.5.7.dylib,
# where it matches 34 times because "return a small constant" is an ordinary
# code shape. Revisit when zstd 2.0 ships.
[[signature]]
vendor = "facebook"
product = "zstandard"
filename_patterns = ['^libzstd\.so', '^libzstd\.[0-9.]*dylib']
# Error messages, present in every build examined. zstd has no version string,
# but it is not anonymous — these identify it, and the byte pattern below
# supplies the number.
contains = [
  'Frame requires too much memory for decoding',
  "Restored data doesn't match checksum",
  'Unsupported frame parameter',
]
version_patterns = []
aliases = ["libzstd", "zstd"]

  # x86-64: endbr64 / mov eax, 0x290b / ret. Verified against Debian trixie's
  # libzstd.so.1.5.7 (x86-64): 5 raw matches, exactly one plausible version.
  [[signature.byte_patterns]]
  pattern = "f3 0f 1e fa b8 .. .. 00 00 c3"
  capture_offset = 5
  encoding = "u32-le"
  formula = "decimal-10000"
  min = 10000
  max = 19999
  note = "ZSTD_versionNumber, x86-64 (endbr64; mov eax, imm32; ret)"

  # AArch64: movz w0, #0x290b / ret. Verified against Homebrew's
  # libzstd.1.5.7.dylib. The operand is bits 5..21 of the instruction word, so
  # the encoding does the exact validation the nibble mask cannot.
  [[signature.byte_patterns]]
  pattern = ".0 .. .. 52 c0 03 5f d6"
  capture_offset = 0
  encoding = "arm64-movz-imm16"
  formula = "decimal-10000"
  min = 10000
  max = 19999
  note = "ZSTD_versionNumber, AArch64 (movz w0, imm16; ret)"

  # ARM (A32): movw r0, #imm16; bx lr. Verified against OpenWrt 23.05.5's
  # libzstd 1.5.2 for arm_cortex-a7 — exactly one movw-then-return site in
  # the whole library, decoding to 10502.
  [[signature.byte_patterns]]
  pattern = ".. 0. 0. e3 1e ff 2f e1"
  capture_offset = 0
  encoding = "arm-movw-imm16"
  formula = "decimal-10000"
  min = 10000
  max = 19999
  note = "ZSTD_versionNumber, ARM (movw r0, imm16; bx lr)"

  # MIPS16e2 (OpenWrt mips_24kc): EXTEND; li v0, imm16; jrc ra. The combined
  # immediate is a bit permutation — the EXTEND word's low five bits land
  # above the LI immediate, its upper six below it — measured against four
  # real accessors (zstd 1.4.5, 1.4.9, 1.5.2, 1.5.7) and decoded by the
  # mips16-extend-li-imm16 encoding. Verified against OpenWrt 23.05.5's
  # libzstd 1.5.2: three li-then-return sites in the library, exactly one
  # plausible version (10502).
  [[signature.byte_patterns]]
  pattern = "f. .. 6a .. e8 a0"
  capture_offset = 0
  encoding = "mips16-extend-li-imm16"
  formula = "decimal-10000"
  min = 10000
  max = 19999
  note = "ZSTD_versionNumber, MIPS16e2 (EXTEND; li v0, imm16; jrc ra)"

# sqlite3 embeds SQLITE_VERSION_NUMBER (major*1000000 + minor*1000 + patch) in
# sqlite3_libversion_number(). The library does carry a bare "3.46.1" string,
# but with nothing adjacent to anchor on — `SQLite format 3` establishes
# identity and the constant supplies the version.
#
# Range: sqlite has been on 3.x since 2004.
[[signature]]
vendor = "sqlite"
# `sqlite`, not `sqlite3`. NVD's CPE product is the former: measured,
# cpe:2.3:a:sqlite:sqlite:3.46.1 returns 7 CVEs and
# cpe:2.3:a:sqlite:sqlite3:3.46.1 returns none. Getting this wrong is a silent
# failure — the scan looks clean rather than broken.
product = "sqlite"
filename_patterns = ['^libsqlite3\.so', '^libsqlite3\.[0-9.]*dylib']
# NOT `SQLite format 3` — that is the database *file* header magic, so it
# matches every .db in a tree rather than the library. NOT `sqlite3_libversion`
# either: a symbol name appears in the dynamic symbol table of anything that
# *links* sqlite, which is a different claim from containing it. Measured over a
# 21,000-file tree: those two match 11 and 8 files, these match 2.
contains = ['attempt to write a readonly database', 'SQLITE_TMPDIR', 'no such table: %s']
version_patterns = []
aliases = ["libsqlite3-0", "libsqlite3", "sqlite3", "sqlite"]

  # x86-64: endbr64; mov eax, 0x2e7a71; ret. Verified against Debian trixie's
  # libsqlite3.so.0.8.6 — 10 matches of this idiom in the file, exactly one
  # inside the range.
  [[signature.byte_patterns]]
  pattern = "f3 0f 1e fa b8 .. .. .. 00 c3"
  capture_offset = 5
  encoding = "u32-le"
  formula = "decimal-1000000"
  min = 3000000
  max = 3999999
  note = "sqlite3_libversion_number, x86-64"

  # AArch64: movz w0,#lo / movk w0,#hi,lsl #16 / ret. Verified against
  # Homebrew's libsqlite3.3.53.3.dylib — one match in the file.
  [[signature.byte_patterns]]
  pattern = ".0 .. .. 52 .0 .. .. 72 c0 03 5f d6"
  capture_offset = 0
  encoding = "arm64-movz-movk-imm32"
  formula = "decimal-1000000"
  min = 3000000
  max = 3999999
  note = "sqlite3_libversion_number, AArch64"

  # MIPS16e2 (OpenWrt mips_24kc): the accessor is a PC-relative load, a
  # return, and the constant sitting in the literal pool as four raw
  # big-endian bytes — the architecture hands the value over without any
  # instruction-level decoding. Verified against OpenWrt 23.05.5's
  # libsqlite3-0_3410200 (sqlite 3.41.2): one occurrence of the shape in the
  # file, decoding to 0x2E66EA = 3041002.
  [[signature.byte_patterns]]
  pattern = "b2 01 e8 a0 .. .. .. .."
  capture_offset = 4
  encoding = "u32-be"
  formula = "decimal-1000000"
  min = 3000000
  max = 3999999
  note = "sqlite3_libversion_number, MIPS16e2 literal pool"

  # ARM (A32): ldr r0, [pc, #..]; bx lr; the constant in the literal pool as
  # four raw little-endian bytes. Verified against OpenWrt 23.05.5's
  # libsqlite3 3.41.2 for arm_cortex-a7 — two pool sites in the library,
  # exactly this one inside the range (0x2E66EA = 3041002).
  [[signature.byte_patterns]]
  pattern = ".. .0 9f e5 1e ff 2f e1 .. .. .. .."
  capture_offset = 8
  encoding = "u32-le"
  formula = "decimal-1000000"
  min = 3000000
  max = 3999999
  note = "sqlite3_libversion_number, ARM literal pool"

# pcre2 gets no byte pattern, deliberately.
#
# It has no numeric version constant to capture: there is no
# `pcre2_version_number()`, only `pcre2_config(PCRE2_CONFIG_VERSION)` copying a
# string. Measured — the `endbr64; mov eax, imm32; ret` idiom occurs **zero**
# times in libpcre2-8.so.0.14.0, and the AArch64 movz/movk equivalent zero times
# in libpcre2-8.0.dylib. There is nothing there to read.
#
# What it does have is `10.47 2025-10-21` as its own string, which only needed
# an anchor. The date suffix is the anchor: a bare `10.47` is meaningless, but
# a version followed by a release date, in a file already established as pcre2
# by its verb strings, is not.
[[signature]]
vendor = "pcre"
product = "pcre2"
filename_patterns = ['^libpcre2-8\.so', '^libpcre2-8\.[0-9.]*dylib', '^libpcre2-16\.so', '^libpcre2-32\.so']
contains = ['BSR_ANYCRLF\)', 'LIMIT_DEPTH=', '\(\*NUL\)', 'PCRE2_ERROR']
version_patterns = ['\n(10\.[0-9]+) 20[0-9]{2}-[0-9]{2}-[0-9]{2}\n']
version_implies_identity = false
aliases = ["libpcre2-8-0", "libpcre2-8-0t64", "pcre2", "libpcre2-16-0", "libpcre2-32-0"]

# --- firmware staples -------------------------------------------------------
#
# Every signature below was derived from a Debian trixie binary whose version
# dpkg recorded, via tools/derive-signatures.py. The version each one reads is
# checked against that record in the tests.

# dropbear is the SSH server in most consumer routers. Its banner is the
# protocol identification string it sends on every connection.
[[signature]]
vendor = "dropbear_ssh_project"
product = "dropbear_ssh"
filename_patterns = ['^dropbear$', '^dropbearmulti$', '^dropbearconvert$']
