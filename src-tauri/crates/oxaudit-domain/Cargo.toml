[package]
name = "oxaudit-domain"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false
license = "Apache-2.0"
description = "Pure canonical domain records and invariants for oxAudit"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.29.1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.154"
