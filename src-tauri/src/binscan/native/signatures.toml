  [[signature.byte_patterns]]
  pattern = "f3 0f 1e fa 48 85 ff 74 06 c7 07 .. .. .. 00 48 8d 05"
  capture_offset = 11
  encoding = "u32-le"
  formula = "packed8"
  min = 65536
  max = 196607
  note = "ares_version, x86-64 (test rdi,rdi; mov [rdi], ARES_VERSION)"

