[workspace]
members = [
  ".",
  "crates/oxaudit-domain",
  "crates/oxaudit-application",
  "crates/oxaudit-benchmark",
  "crates/oxaudit-compliance",
  "crates/oxaudit-scanners",
]
resolver = "2"

[package]
name = "vulncompanion"
version = "0.1.0"
description = "VulnCompanion — AI-assisted vulnerability research companion"
authors = ["Henry Cooper"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vulncompanion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
oxaudit-domain = { path = "crates/oxaudit-domain" }
oxaudit-application = { path = "crates/oxaudit-application" }
oxaudit-benchmark = { path = "crates/oxaudit-benchmark" }
oxaudit-compliance = { path = "crates/oxaudit-compliance" }
oxaudit-scanners = { path = "crates/oxaudit-scanners" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
walkdir = "2"
ignore = "0.4"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.37"
once_cell = "1"
log = "0.4"
percent-encoding = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "process", "io-util"] }
futures = "0.3"
printpdf = { version = "0.8.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
