[package]
name = "oxaudit-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false
license = "Apache-2.0"
description = "GUI-neutral oxAudit use cases, ports, manifests, and run coordination"

[dependencies]
oxaudit-domain = { path = "../oxaudit-domain" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
toml = "1.2.1"
