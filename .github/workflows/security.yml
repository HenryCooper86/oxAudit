name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  npm-audit:
    name: JavaScript supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:dependencies

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Required CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          upload-database: false
          output: codeql-results
      - name: Retain CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results/**/*.sarif
          if-no-files-found: error
      # Private repository code scanning is unavailable until the owner opts in
      # to an eligible, enabled capability. Analysis and artifacts stay required.
      - name: Publish CodeQL to code scanning (optional capability)
        if: vars.OXAUDIT_CODE_SCANNING == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: codeql-results
          category: codeql-javascript-typescript

  cargo-deny:
    name: Rust supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dependency-review only runs on pull requests and does not walk the Cargo
      # tree, where most of oxAudit's code lives. cargo-deny is what actually
      # gates the Rust supply chain: advisories, licences, bans, and sources.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, licences, bans, and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  # Every pull request and push compiles the fuzz targets, so a change to the
  # scanner or archive crates that breaks a harness fails here rather than
  # surfacing days later on the weekly run below.
  parser-fuzz-build:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build every fuzz target
        working-directory: src-tauri
        run: cargo +nightly fuzz build

  parser-fuzz-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz bounded rule-pack parsing
        working-directory: src-tauri
        run: cargo +nightly fuzz run rule_pack -- -max_total_time=60 -timeout=5
      - name: Fuzz archive extraction
        working-directory: src-tauri
        run: cargo +nightly fuzz run extract_archive -- -max_total_time=60 -timeout=5
      # The parser targets start from the committed seeds in fuzz/seeds/; new
      # inputs go to the ignored fuzz/corpus/ so the seeds stay as reviewed.
      - name: Fuzz lockfile parsing
        working-directory: src-tauri
        run: |
          mkdir -p fuzz/corpus/parse_lockfile
          cargo +nightly fuzz run parse_lockfile fuzz/corpus/parse_lockfile fuzz/seeds/parse_lockfile -- -max_total_time=60 -timeout=5
      - name: Fuzz report import
        working-directory: src-tauri
        run: |
          mkdir -p fuzz/corpus/import_report
          cargo +nightly fuzz run import_report fuzz/corpus/import_report fuzz/seeds/import_report -- -max_total_time=60 -timeout=5
      - name: Fuzz package notes, package databases and the feed index
        working-directory: src-tauri
        run: |
          mkdir -p fuzz/corpus/package_metadata
          cargo +nightly fuzz run package_metadata fuzz/corpus/package_metadata fuzz/seeds/package_metadata -- -max_total_time=60 -timeout=5
      # A crash is only actionable with the input that produced it; libFuzzer
      # writes it under fuzz/artifacts/<target>/ and the runner discards it.
      - name: Retain fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/fuzz/artifacts/**
          if-no-files-found: warn
          retention-days: 30
