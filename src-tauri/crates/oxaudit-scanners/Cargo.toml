[package]
name = "oxaudit-scanners"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false
license = "Apache-2.0"
description = "Deterministic native scanners and declarative rule compilation for oxAudit"

[dependencies]
hex = "0.4.3"
oxaudit-application = { path = "../oxaudit-application" }
oxaudit-domain = { path = "../oxaudit-domain" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
