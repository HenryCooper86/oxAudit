[package]
name = "oxaudit-domain"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false
license = "Apache-2.0"
description = "Pure canonical domain records and invariants for oxAudit"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
