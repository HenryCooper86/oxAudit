[workspace]
members = [
  ".",
  "crates/oxaudit-domain",
  "crates/oxaudit-application",
  "crates/oxaudit-benchmark",
  "crates/oxaudit-compliance",
  "crates/oxaudit-scanners",
]
resolver = "2"

[package]
name = "oxaudit"
version = "0.1.0"
description = "oxAudit — security research workbench"
authors = ["Henry Cooper"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"
# The package builds two binaries: the desktop app from src/main.rs and
# src/bin/oxaudit-cli.rs. Without this, Tauri picked the CLI as the app's
# main executable, so the bundled .app ran the command line, printed its
# help to a console nobody could see, and exited without a window.
default-run = "oxaudit"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Every grammar, which is what a released build ships. Dropping one does not
# make oxAudit quieter about that language — it makes it *louder*: with no
# grammar there is nothing to prove a match sits in a comment or a string, so
# every match stands and the analysis reports Unknown rather than suppressing
# on a guess. A stripped build trades binary size for precision, never for
# recall, and `oxaudit-cli languages` prints exactly which grammars are in the
# binary you are holding.
#
# The Kotlin, Swift, C#, and C++ grammars are the large ones; dropping all four
# is most of the saving.
default = ["grammars-all"]

grammars-all = [
  "grammar-javascript",
  "grammar-python",
  "grammar-java",
  "grammar-rust",
  "grammar-go",
  "grammar-php",
  "grammar-ruby",
  "grammar-c",
  "grammar-cpp",
  "grammar-csharp",
  "grammar-kotlin",
  "grammar-swift",
]

# The five oxAudit shipped with, and the five its dataflow analysis is tuned
# for. A reasonable floor for a size-constrained build.
grammars-core = [
  "grammar-javascript",
  "grammar-python",
  "grammar-java",
  "grammar-rust",
  "grammar-go",
]

grammar-javascript = ["dep:tree-sitter-javascript"]
grammar-python = ["dep:tree-sitter-python"]
grammar-java = ["dep:tree-sitter-java"]
grammar-rust = ["dep:tree-sitter-rust"]
grammar-go = ["dep:tree-sitter-go"]
grammar-php = ["dep:tree-sitter-php"]
grammar-ruby = ["dep:tree-sitter-ruby"]
grammar-c = ["dep:tree-sitter-c"]
grammar-cpp = ["dep:tree-sitter-cpp"]
grammar-csharp = ["dep:tree-sitter-c-sharp"]
grammar-kotlin = ["dep:tree-sitter-kotlin-ng"]
grammar-swift = ["dep:tree-sitter-swift"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oxaudit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
oxaudit-domain = { path = "crates/oxaudit-domain" }
oxaudit-application = { path = "crates/oxaudit-application" }
oxaudit-benchmark = { path = "crates/oxaudit-benchmark" }
oxaudit-compliance = { path = "crates/oxaudit-compliance" }
oxaudit-scanners = { path = "crates/oxaudit-scanners" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
dirs = "7"
toml = "1.1"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
walkdir = "2"
ignore = "0.4"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
sha2 = "0.11"
sha1 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.42"
once_cell = "1"
log = "0.4"
percent-encoding = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "process", "io-util", "net"] }
futures = "0.3"
printpdf = { version = "0.12.8", default-features = false }
keyring = { version = "3.6.3", default-features = false }
zeroize = "1.8"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.27.0"
# Each grammar is optional and selected by a `grammar-*` feature. See the
# [features] section for what a build without one actually does.
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
include_dir = "0.7.4"
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "scanning"
harness = false
