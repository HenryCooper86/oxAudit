[pack]
schema_version = 1
id = "oxaudit.native-binary-signatures"
version = "1.0.0"
authors = ["oxAudit contributors"]
source = "Independently known-version binaries and repository-authored regression fixtures; see docs/binary-signatures.md"
license = "Apache-2.0"
creation_method = "independently-derived"
signatures_sha256 = "2a7423fe8c360414f551ea011265aff884a884e752702bfda69a91c013e94d3f"
architectures = ["architecture-independent strings", "x86-64", "aarch64", "mips16e2", "arm32"]

[fixtures]
positive_suites = [
  "embedded:FIRMWARE_GROUND_TRUTH",
  "embedded:CONSTANT_GROUND_TRUTH",
  "embedded:REAL_BUILD_GROUND_TRUTH",
  "embedded:IDENTITY_ONLY",
  "embedded:zstandard-byte-identity",
  "embedded:pcre2-identity-gate",
]
negative_suites = [
  "embedded:elf-symbol-version-tags",
  "embedded:documented-minimum-versions",
  "embedded:sshd-compatibility-list",
  "embedded:openvpn-minimum-version",
  "embedded:byte-pattern-without-identity",
]

# Fixture status is explicit and exhaustive. `verified_products` have a
# committed positive detection fixture. `unverified_products` remain available
# because they were independently derived before the provenance contract, but
# Quality Lab must show their fixture health as incomplete until a positive
# receipt is added. Nothing is counted as verified merely because it compiles.
