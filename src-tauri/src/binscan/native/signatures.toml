  [[signature.byte_patterns]]
  pattern = "f3 0f 1e fa b8 .. 00 00 00 c3 66 0f 1f 44 00 00 f3 0f 1e fa b8 .. 00 00 00 c3"
  capture_offset = 5
  capture_offset_2 = 21
