filename_patterns = ['^libtirpc\.so', '^libtirpc\.[0-9.]*dylib']
contains = ['rpc_broadcast_exp: uaddr %s', 'Netconfig database not found', 'clnt_tli_create failed']
version_patterns = []
aliases = ["libtirpc3", "libtirpc3t64", "libtirpc"]

[[signature]]
vendor = "netfilter"
product = "libnftnl"
filename_patterns = ['^libnftnl\.so', '^libnftnl\.[0-9.]*dylib']
contains = ['libnftnl: attribute %d > %d \(maximum\) assertion fail', 'libnftnl: attribute %d assertion failed']
version_patterns = []
aliases = ["libnftnl11", "libnftnl"]

[[signature]]
vendor = "json-c"
product = "json-c"
filename_patterns = ['^libjson-c\.so', '^libjson-c\.[0-9.]*dylib']
contains = ['json-c aborts with error: %s', 'json_c_set_serialization_double_format']
version_patterns = []
aliases = ["libjson-c5", "libjson-c4", "json-c"]

[[signature]]
vendor = "libidn2_project"
product = "libidn2"
filename_patterns = ['^libidn2\.so', '^libidn2\.[0-9.]*dylib']
contains = ['input A-label is not valid', 'string contains invalid punycode data']
version_patterns = []
aliases = ["libidn2-0", "libidn2"]

[[signature]]
vendor = "e2fsprogs_project"
product = "e2fsprogs"
filename_patterns = ['^dumpe2fs$', '^mke2fs$', '^e2fsck$', '^libext2fs\.so', '^tune2fs$', '^resize2fs$']
contains = ['Journal superblock magic number invalid!', 'while reading journal superblock']
version_patterns = []
aliases = ["e2fsprogs", "libext2fs2", "libext2fs2t64", "libext2fs"]
