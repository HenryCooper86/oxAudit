name: Quality and performance benchmarks

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Pinned OWASP categories and owned CLI workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Materialize pinned toolchain and build CLI
        id: build
        run: |
          rustup show active-toolchain
          rustc --version
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin oxaudit-cli

      # Fetch source only. Never build OWASP, run its servlets or install its dependencies.
      - name: Fetch and verify pinned external corpus
        run: node tools/fetch-external-benchmark.mjs

      - name: Record pinned external category results and provenance
        id: record
        run: |
          node tools/record-quality-benchmark.mjs \
            --cli ./src-tauri/target/release/oxaudit-cli \
            --corpus benchmarks/external/owasp-benchmark \
            --output artifacts/quality

      - name: Enforce compatible per-category quality baseline
        if: always() && steps.record.outcome == 'success'
        run: |
          node tools/compare-quality-benchmark.mjs \
            --result artifacts/quality/result.json \
            --baseline benchmarks/baselines/owasp-java-550021e9.json \
            --output artifacts/quality/comparison

      - name: Measure owned local CLI workloads
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p artifacts
          node tools/cli-performance.mjs \
            --cli ./src-tauri/target/release/oxaudit-cli \
            --output artifacts/performance.json

      - name: Retain raw results, category comparisons and performance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
