aliases = ["libmosquitto1", "mosquitto"]

  [[signature.byte_patterns]]
  pattern = "74 06 c7 02 .. 00 00 00 b8 .. .. .. 00 c3"
  capture_offset = 9
  encoding = "u32-le"
  formula = "decimal-1000000"
  min = 1000000
  max = 2999999
