# oxAudit in GitLab CI. Copy the job into .gitlab-ci.yml, and
# examples/ci/install-oxaudit.sh into ci/install-oxaudit.sh.
#
# Results appear three ways:
#   - Code Quality widget on the merge request (every GitLab tier);
#   - Dependency Scanning report in the security widgets (Ultimate);
#   - JUnit test report on the pipeline's Tests tab.
#
# The job fails on a `deny` violation of .oxaudit/component-policy.json, or
# on source findings at or above --fail-on. Reports are uploaded either way.

oxaudit:
  stage: test
  # The published Linux CLI needs glibc 2.39 or newer (Ubuntu 24.04,
  # Debian 13, Fedora 40). It does not start on Debian 12 or Ubuntu 22.04.
  image: ubuntu:24.04
  variables:
    # Pin both together. The digest is oxaudit-cli-linux-x86_64 from that
    # release's SHA256SUMS.txt; use another asset's line on another architecture.
    OXAUDIT_VERSION: "v0.3.1"
    OXAUDIT_SHA256: "7ee0e7a31fad9acd6e2771585c65be7b38980f550badad1a3824a28f7d4278fc"
    GIT_DEPTH: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl
    - sh ci/install-oxaudit.sh
  script:
    - mkdir -p oxaudit-reports
    # Run every step, remember the worst exit code, fail at the end: a failed
    # gate must not hide the other reports.
    - status=0
    - .oxaudit-tool/oxaudit-cli scan . --fail-on high
        --format gitlab-code-quality -o oxaudit-reports/source-quality.json || status=$?
    - .oxaudit-tool/oxaudit-cli sca . --db oxaudit-reports/db/findings.db
        --format gitlab-code-quality -o oxaudit-reports/sca-quality.json
        --notices oxaudit-reports/THIRD-PARTY-NOTICES.md || status=$?
    # The same stored run, re-rendered offline: no second advisory lookup.
    - .oxaudit-tool/oxaudit-cli sca . --db oxaudit-reports/db/findings.db --offline --report-only
        --format gitlab-dependency-scanning -o oxaudit-reports/gl-dependency-scanning-report.json || status=$?
    - .oxaudit-tool/oxaudit-cli sca . --db oxaudit-reports/db/findings.db --offline --report-only
        --format junit -o oxaudit-reports/sca-junit.xml || status=$?
    - .oxaudit-tool/oxaudit-cli deps . --db oxaudit-reports/db/findings.db --offline
        --format cyclonedx -o oxaudit-reports/sbom.cdx.json || status=$?
    - exit $status
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - oxaudit-reports/*.json
      - oxaudit-reports/*.xml
      - oxaudit-reports/*.md
    reports:
      codequality:
        - oxaudit-reports/source-quality.json
        - oxaudit-reports/sca-quality.json
      dependency_scanning: oxaudit-reports/gl-dependency-scanning-report.json
      junit: oxaudit-reports/sca-junit.xml
      cyclonedx: oxaudit-reports/sbom.cdx.json
