[package]
name = "oxaudit-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
description = "GUI-neutral oxAudit use cases, ports, manifests, and run coordination"

[dependencies]
oxaudit-domain = { path = "../oxaudit-domain" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
toml = "0.8"
