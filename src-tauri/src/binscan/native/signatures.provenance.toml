  "international_components_for_unicode",
  "libxml2",
]
unverified_reason = "Identity anchors measured absent from real modern builds: neither 'ICU 7x' nor 'libxml2 version'/'xmlsoft.org' occurs anywhere in Homebrew icu4c 78.3, Debian trixie's libicu 76.1, or Debian's libxml2 2.9.14. These signatures need re-derivation against a real modern binary before they can claim anything, and are not included in verified coverage."
