# The oxAudit GitHub Action: download a pinned release of oxaudit-cli,
# verify it against the release's SHA256SUMS.txt, and run it.
#
# Public release assets are available. Pin the action to a reviewed commit
# and select a published version that includes the runner's platform;
# docs/getting-started.md lists the available artifacts and verification limits.
name: oxAudit Security Scan
description: Scan source, dependencies, and binaries for vulnerabilities and leaked credentials — fully local.
branding:
  icon: shield
  color: blue

inputs:
  target:
    description: Path to the source tree to scan with `oxaudit-cli scan` (default `.`, the workspace root). Dependency, image, and registry scans are not run by this action.
    required: false
    default: .
  version:
    description: Release tag to use (default: latest).
    required: false
    default: latest
  args:
    description: Extra `oxaudit-cli scan` flags, split on whitespace with no shell evaluation (e.g. `--fail-on high --format sarif -o oxaudit.sarif`). Quotes, globs, and variable expansions are passed through literally.
    required: false
    default: ""
  repo:
    description: Repository hosting the releases (default: this action's repository).
    required: false
    default: HenryCooper86/oxAudit

runs:
  using: composite
  steps:
    - name: Download and verify oxaudit-cli
      shell: bash
      env:
        OXAUDIT_VERSION: ${{ inputs.version }}
        OXAUDIT_REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)    asset="oxaudit-cli-linux-x86_64" ;;
          Linux-ARM64)  asset="oxaudit-cli-linux-aarch64" ;;
          macOS-X64)    asset="oxaudit-cli-macos-universal" ;;
          macOS-ARM64)  asset="oxaudit-cli-macos-universal" ;;
          Windows-X64)  asset="oxaudit-cli-windows-x86_64.exe" ;;
          *)
            echo "oxAudit publishes no binary for ${RUNNER_OS}-${RUNNER_ARCH}." >&2
            echo "Build the CLI from source: cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin oxaudit-cli" >&2
            exit 2 ;;
        esac
        if [ "$OXAUDIT_VERSION" = "latest" ]; then
          tag_url="https://github.com/${OXAUDIT_REPO}/releases/latest/download"
        else
          tag_url="https://github.com/${OXAUDIT_REPO}/releases/download/${OXAUDIT_VERSION}"
        fi
        install_dir="${RUNNER_TEMP:-/tmp}/oxaudit"
        mkdir -p "$install_dir"
        echo "$tag_url/$asset"
        curl -fsSL --retry 5 --retry-all-errors -o "$install_dir/$asset" "$tag_url/$asset"
        curl -fsSL --retry 5 --retry-all-errors -o "$install_dir/SHA256SUMS.txt" "$tag_url/SHA256SUMS.txt"
        cd "$install_dir"
        if command -v shasum >/dev/null 2>&1; then
          sha256_check() { shasum -a 256 -c -; }
        elif command -v sha256sum >/dev/null 2>&1; then
          sha256_check() { sha256sum -c -; }
        else
          echo "Neither shasum nor sha256sum is available to verify $asset." >&2
          exit 2
        fi
        # Exactly one checksum line must name this asset; an empty selection
        # would otherwise give `-c` nothing to verify.
        sums="$(awk -v a="$asset" '$2 == a || $2 == "*" a' SHA256SUMS.txt)"
        if [ -z "$sums" ] || [ "$(printf '%s\n' "$sums" | wc -l)" -ne 1 ]; then
          echo "SHA256SUMS.txt does not list $asset exactly once." >&2
          exit 2
        fi
        printf '%s\n' "$sums" | sha256_check
        if [ "${RUNNER_OS}" = "Windows" ]; then
          cli="$(pwd -W)/$asset"
        else
          chmod +x "$asset"
          cli="$(pwd)/$asset"
        fi
        echo "cli=$cli" >> "$GITHUB_ENV"

    # Inputs reach the shell only through the environment, never by template
    # substitution into the script, so a target or argument string cannot
    # inject commands. `args` is split on whitespace into an array without
    # eval: quotes, globs, `$()` and `;` stay literal argument text.
    - name: Run the scan
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        extra_args=()
        if [ -n "$INPUT_ARGS" ]; then
          read -r -d "" -a extra_args <<< "$INPUT_ARGS" || true
        fi
        # `--` ends option parsing, so a target beginning with `-` is a path.
        "${cli:?oxaudit-cli was not installed by the previous step}" scan ${extra_args[@]+"${extra_args[@]}"} -- "$INPUT_TARGET"
