[package]
name = "oxaudit-parsers"
version = "0.1.0"
description = "Parsers for untrusted lockfiles, imported reports, package databases and feed indexes"
authors = ["Henry Cooper"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
# No `preserve_order`: objects iterate in key order, which the tests pin and
# which the app's runtime graph (only Tauri's build scripts enable it) shares.
serde_json = "1.0.154"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
indexmap = { version = "2.14.2", features = ["serde"] }
toml = "1.2.1"
regex = "1.13.1"
once_cell = "1.21.4"
quick-xml = "0.42.0"
# Already in the dependency graph (via regex); finds the Go build-info magic.
memchr = "2.8.3"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
