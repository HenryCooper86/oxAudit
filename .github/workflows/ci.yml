name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check version declarations agree
        run: node tools/check-versions.mjs

      - name: Check the benchmark corpus manifest is current
        run: node tools/build-corpus-suite.mjs --check

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      # The version and components come from rust-toolchain.toml at the repo
      # root. `rustup show` materializes them; naming a toolchain here would
      # reintroduce the drift that file exists to prevent.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-features

      - name: Validate benchmark and provenance contracts
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -p oxaudit-benchmark
          cargo test --manifest-path src-tauri/Cargo.toml -p oxaudit bundled_signature_provenance

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      # The corpus is the only defensible answer to "how accurate is it?", so a
      # change that drops precision or recall has to fail rather than quietly
      # move the number the README publishes.
      - name: Check detection quality has not regressed
        if: runner.os == 'Linux'
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --release --bin oxaudit-cli -- \
            benchmark --min-precision 100 --min-recall 100
