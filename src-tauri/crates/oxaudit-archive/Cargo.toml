[package]
name = "oxaudit-archive"
version = "0.1.0"
description = "Bounded in-memory archive and filesystem-image extraction for binary scanning"
authors = ["Henry Cooper"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false

[dependencies]
hex = "0.4.3"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
zstd = "0.14.3"
liblzma = "0.4.9"
bzip2 = "0.6.1"
tar = "0.4.46"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
backhand = "0.25.5"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
