[workspace]
members = [
  ".",
  "crates/oxaudit-domain",
  "crates/oxaudit-application",
  "crates/oxaudit-benchmark",
  "crates/oxaudit-compliance",
  "crates/oxaudit-scanners",
]
resolver = "2"

[package]
name = "oxaudit"
version = "0.1.0"
description = "oxAudit — security research workbench"
authors = ["Henry Cooper"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"
# The package builds two binaries: the desktop app from src/main.rs and
# src/bin/oxaudit-cli.rs. Without this, Tauri picked the CLI as the app's
# main executable, so the bundled .app ran the command line, printed its
# help to a console nobody could see, and exited without a window.
default-run = "oxaudit"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oxaudit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
oxaudit-domain = { path = "crates/oxaudit-domain" }
oxaudit-application = { path = "crates/oxaudit-application" }
oxaudit-benchmark = { path = "crates/oxaudit-benchmark" }
oxaudit-compliance = { path = "crates/oxaudit-compliance" }
oxaudit-scanners = { path = "crates/oxaudit-scanners" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
walkdir = "2"
ignore = "0.4"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.42"
once_cell = "1"
log = "0.4"
percent-encoding = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "process", "io-util", "net"] }
futures = "0.3"
printpdf = { version = "0.8.2", default-features = false }
keyring = { version = "3.6.3", default-features = false }
zeroize = "1.8"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.26.13"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "scanning"
harness = false
