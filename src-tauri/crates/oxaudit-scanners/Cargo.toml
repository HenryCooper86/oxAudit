[package]
name = "oxaudit-scanners"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
description = "Deterministic native scanners and declarative rule compilation for oxAudit"

[dependencies]
oxaudit-application = { path = "../oxaudit-application" }
oxaudit-domain = { path = "../oxaudit-domain" }
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }

[dev-dependencies]
tempfile = "3"
