[package]
name = "oxaudit-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false
license = "Apache-2.0"
description = "Resumable deterministic ground-truth benchmark contracts for oxAudit"

[dependencies]
oxaudit-domain = { path = "../oxaudit-domain" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
