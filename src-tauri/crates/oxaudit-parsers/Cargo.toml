[package]
name = "oxaudit-parsers"
version = "0.1.0"
description = "Parsers for untrusted lockfiles, imported reports, package databases and feed indexes"
authors = ["Henry Cooper"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"
# Internal to the oxAudit workspace; not published to crates.io.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# No `preserve_order`: objects iterate in key order, which the tests pin and
# which the app's runtime graph (only Tauri's build scripts enable it) shares.
serde_json = "1"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
indexmap = { version = "2", features = ["serde"] }
toml = "1.1"
regex = "1"
once_cell = "1"
quick-xml = "0.42"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
