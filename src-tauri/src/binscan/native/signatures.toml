aliases = ["libnghttp2-14", "nghttp2"]

  [[signature.byte_patterns]]
  pattern = "f3 0f 1e fa 81 ff .. .. .. 00 ba 00 00 00 00"
  capture_offset = 6
  encoding = "u32-le"
  formula = "packed8"
  min = 65536
  max = 196607
  note = "nghttp2_version, x86-64 (endbr64; cmp edi, NGHTTP2_VERSION_NUM)"

